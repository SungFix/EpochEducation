name: Qualidade

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe JavaScript
        run: |
          node --check app.js
          node --check platform-features.js
          node --check bootstrap.js
          node --check service-worker.js
      - name: Regenerar standalone para validação
        run: python3 scripts/build-standalone.py
      - name: Integridade do site e conteúdo
        run: node scripts/validate.mjs
