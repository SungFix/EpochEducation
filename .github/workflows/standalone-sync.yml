name: Sincronizar standalone

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'content-data.js'
      - 'app.js'
      - 'platform-features.js'
      - 'bootstrap.js'
      - 'assets/**'
      - 'scripts/build-standalone.py'

permissions:
  contents: write

concurrency:
  group: standalone-sync
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerar standalone
        run: python3 scripts/build-standalone.py
      - name: Publicar standalone atualizado
        run: |
          if git diff --quiet -- Epoch-Education.html index-standalone-preview.html; then
            echo "Standalone já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Epoch-Education.html index-standalone-preview.html
          git commit -m "chore: sincroniza standalone v54"
          git push
